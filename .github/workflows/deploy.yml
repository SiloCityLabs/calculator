name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          # App shell
          cp index.html styles.css calc.js app.js sw.js manifest.webmanifest _site/
          cp .nojekyll CNAME _site/
          # Icons (PWA / favicons)
          mkdir -p _site/icons
          cp -r icons/. _site/icons/
          # Keep source brand icon available
          if [ -f images/icon.png ]; then
            mkdir -p _site/images
            cp images/icon.png _site/images/icon.png
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
