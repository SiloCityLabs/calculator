<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0e21" id="themeColor" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="A fast, offline calculator — just like Google's, as a PWA." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculator" />
  <title>Calculator</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (() => {
      const t = localStorage.getItem("calc.theme.v1") || "system";
      document.documentElement.dataset.theme = ["system", "light", "dark"].includes(t) ? t : "system";
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="top-bar">
      <button type="button" class="icon-btn" id="historyToggle" aria-label="History" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 1.73 4.63l1.42 1.42A8.96 8.96 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>
      <div class="menu-panel" id="menuPanel" hidden role="menu">
        <button type="button" role="menuitem" data-action="clear-history">Clear history</button>
        <button type="button" role="menuitem" data-action="toggle-theme">Theme: <span id="themeLabel">system</span></button>
        <button type="button" role="menuitem" data-action="toggle-haptics">Haptics: <span id="hapticsLabel">on</span></button>
        <button type="button" role="menuitem" data-action="toggle-format">Format: <span id="formatLabel">standard</span></button>
        <button type="button" role="menuitem" data-action="copy-result">Copy result</button>
        <button type="button" role="menuitem" data-action="install" id="installItem" hidden>Install app</button>
      </div>
    </header>

    <section class="history-panel" id="historyPanel" aria-label="Calculation history" hidden>
      <div class="history-scroll" id="historyList"></div>
    </section>

    <section class="display" aria-live="polite">
      <span class="current-label" id="currentLabel">Current expression</span>
      <div class="expression-wrap">
        <div class="expression" id="expression" tabindex="0" aria-label="Expression">0</div>
      </div>
      <div class="result" id="result" aria-label="Result"></div>
    </section>

    <section class="keypad" id="keypad">
      <div class="keypad-toolbar">
        <button type="button" class="icon-btn expand-btn" id="sciToggle" aria-label="Show scientific functions" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
        </button>
      </div>

      <div class="sci-pad" id="sciPad" hidden>
        <button type="button" class="key sci" data-key="sqrt">√</button>
        <button type="button" class="key sci" data-key="pi">π</button>
        <button type="button" class="key sci" data-key="^">^</button>
        <button type="button" class="key sci" data-key="!">!</button>

        <button type="button" class="key sci" data-key="deg" id="angleMode">Deg</button>
        <button type="button" class="key sci" data-key="sin">sin</button>
        <button type="button" class="key sci" data-key="cos">cos</button>
        <button type="button" class="key sci" data-key="tan">tan</button>

        <button type="button" class="key sci" data-key="inv" id="invToggle">Inv</button>
        <button type="button" class="key sci" data-key="e">e</button>
        <button type="button" class="key sci" data-key="ln">ln</button>
        <button type="button" class="key sci" data-key="log">log</button>
      </div>

      <div class="main-pad">
        <button type="button" class="key ac" data-key="AC">AC</button>
        <button type="button" class="key op" data-key="()">()</button>
        <button type="button" class="key op" data-key="%">%</button>
        <button type="button" class="key op accent" data-key="÷">÷</button>

        <button type="button" class="key num" data-key="7">7</button>
        <button type="button" class="key num" data-key="8">8</button>
        <button type="button" class="key num" data-key="9">9</button>
        <button type="button" class="key op accent" data-key="×">×</button>

        <button type="button" class="key num" data-key="4">4</button>
        <button type="button" class="key num" data-key="5">5</button>
        <button type="button" class="key num" data-key="6">6</button>
        <button type="button" class="key op accent" data-key="−">−</button>

        <button type="button" class="key num" data-key="1">1</button>
        <button type="button" class="key num" data-key="2">2</button>
        <button type="button" class="key num" data-key="3">3</button>
        <button type="button" class="key op accent" data-key="+">+</button>

        <button type="button" class="key num" data-key="0">0</button>
        <button type="button" class="key num" data-key=".">.</button>
        <button type="button" class="key num" data-key="back" aria-label="Backspace">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path fill="currentColor" d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L13 14.41 16.59 18 18 16.59 14.41 13 18 9.41 16.59 8 13 11.59 9.41 8 8 9.41 11.59 13 8 16.59z"/>
          </svg>
        </button>
        <button type="button" class="key eq" data-key="=">=</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="calc.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
